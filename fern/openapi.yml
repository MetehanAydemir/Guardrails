info:
  description: Guardrails Server API.
  license:
    name: Apache License, Version 2.0
  title: Guardrails Server API
  version: 0.1.0
openapi: 3.1.0
paths:
  /:
    get:
      operationId: root_handler__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root Handler
  /healthz:
    get:
      description: Return HTTP 200 while the server process is running and able to serve requests.
      operationId: health_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Liveness health check.
      tags:
      - Health
  /v1/challenges:
    get:
      description: Returns the list of available challenges for red teaming.
      operationId: get_challenges_v1_challenges_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Get list of available challenges.
  /v1/chat/completions:
    post:
      description: 'Chat completion for the provided conversation.


        TODO: add support for explicit state object.'
      operationId: chat_completion_v1_chat_completions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardrailsChatCompletionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailsChatCompletion'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Chat Completion
  /v1/checks:
    post:
      description: 'Guardrail check request.


        Returns 422 when ``rail_types`` includes a type with no configured flows, or when

        the serving engine cannot run a tool check it was asked for: a tool rail type, or

        ``tools``, on a config the IORails engine does not serve.'
      operationId: guardrail_check_v1_checks_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardrailCheckRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardrailCheckResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Guardrail Check
  /v1/health:
    get:
      description: Return HTTP 200 while the server process is running and able to serve requests.
      operationId: health_v1_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Liveness health check.
      tags:
      - Health
  /v1/models:
    get:
      description: Return the list of models available from the configured provider.
      operationId: list_models_v1_models_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIModelsList'
          description: Successful Response
      summary: Get list of available models.
  /v1/rails/configs:
    get:
      description: Returns the list of available rails configurations.
      operationId: get_rails_configs_v1_rails_configs_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Get List of available rails configurations.
