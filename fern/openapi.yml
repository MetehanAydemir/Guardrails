          const: moderation_result
          title: Type
          type: string
      required:
      - categories
      - category_applied_input_types
      - category_scores
      - flagged
      - model
      - type
      title: ModerationInputModerationResultsResult
      type: object
    ModerationOutputError:
      additionalProperties: true
      description: An error produced while attempting moderation.
      properties:
        code:
          title: Code
          type: string
        message:
          title: Message
          type: string
        type:
          const: error
          title: Type
          type: string
      required:
      - code
      - message
      - type
      title: ModerationOutputError
      type: object
    ModerationOutputModerationResults:
      additionalProperties: true
      description: Successful moderation results for the request input or generated output.
      properties:
        model:
          title: Model
          type: string
        results:
          items:
            $ref: '#/components/schemas/ModerationOutputModerationResultsResult'
          title: Results
          type: array
        type:
          const: moderation_results
          title: Type
          type: string
      required:
      - model
      - results
      - type
      title: ModerationOutputModerationResults
      type: object
    ModerationOutputModerationResultsResult:
      additionalProperties: true
      description: A moderation result produced for the response input or output.
      properties:
        categories:
          additionalProperties:
            type: boolean
          title: Categories
          type: object
        category_applied_input_types:
          additionalProperties:
            items:
              enum:
              - text
              - image
              type: string
            type: array
          title: Category Applied Input Types
          type: object
        category_scores:
          additionalProperties:
            type: number
          title: Category Scores
          type: object
        flagged:
          title: Flagged
          type: boolean
        model:
          title: Model
          type: string
        type:
          const: moderation_result
          title: Type
          type: string
      required:
      - categories
      - category_applied_input_types
      - category_scores
      - flagged
      - model
      - type
      title: ModerationOutputModerationResultsResult
      type: object
    OpenAIModel:
      description: Standard OpenAI model.
      properties:
        created:
          description: The unix timestamp in seconds of the model's creation.
          title: Created
          type: integer
        id:
          description: The model identifier.
          title: Id
          type: string
        object:
          const: model
          default: model
          description: The object type which is always 'model'.
          title: Object
          type: string
        owned_by:
          anyOf:
          - type: string
          - type: 'null'
          description: The organization that owns the model.
          title: Owned By
      required:
      - id
      - created
      - owned_by
      title: OpenAIModel
      type: object
    OpenAIModelsList:
      description: Standard OpenAI models list response.
      properties:
        data:
          description: List of OpenAI model objects.
          items:
            $ref: '#/components/schemas/OpenAIModel'
          title: Data
          type: array
      required:
      - data
      title: OpenAIModelsList
      type: object
    PromptTokensDetails:
      additionalProperties: true
      description: Breakdown of tokens used in the prompt.
      properties:
        audio_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Audio Tokens
        cached_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Cached Tokens
      title: PromptTokensDetails
      type: object
    RailType:
      enum:
      - input
      - output
      - tool_call
      - tool_result
      title: RailType
      type: string
    ToolViolation:
      description: One tool call or tool result a tool rail blocked, identified so a caller can act on
        it.
      properties:
        argument_path:
          anyOf:
          - type: string
          - type: 'null'
          description: JSON Pointer to the failing argument (`arguments_invalid` only).
          title: Argument Path
        index:
          anyOf:
          - type: integer
          - type: 'null'
          description: For a call, its position in the last assistant message's `tool_calls`. For a result,
            its message's position in `messages`.
          title: Index
        kind:
          description: Whether a tool call or a tool result was blocked.
          enum:
          - tool_call
          - tool_result
          title: Kind
          type: string
        rail:
          anyOf:
          - type: string
          - type: 'null'
          description: The rail that blocked or failed (`per_tool_rail` and `rail_failed` only).
          title: Rail
        reason:
          description: Why it was blocked. Never contains argument values or tool-result content.
          title: Reason
          type: string
        schema_keyword:
          anyOf:
          - type: string
          - type: 'null'
          description: The JSON Schema keyword that failed (`arguments_invalid` only).
          title: Schema Keyword
        tool_call_id:
          anyOf:
          - type: string
          - type: 'null'
          description: The call's id, or the id the result links to.
          title: Tool Call Id
        tool_name:
          anyOf:
          - type: string
          - type: 'null'
          description: The tool called. For a result, taken from the call it links to.
          title: Tool Name
        violation_type:
          $ref: '#/components/schemas/ToolViolationType'
          description: What the call or result violated. Switch on this, never on `reason`.
      required:
      - kind
      - violation_type
      - reason
      title: ToolViolation
      type: object
    ToolViolationType:
      description: What a blocked tool call or tool result violated; callers switch on this, never on
        the reason text.
      enum:
      - tool_not_allowed
      - arguments_invalid
      - unexpected_arguments
      - invalid_tool_schema
      - malformed_arguments
      - malformed_tool_call
      - legacy_function_call
      - invalid_toolset
      - missing_call_id
      - unknown_call_id
      - duplicate_result
      - duplicate_prior_call_id
      - name_mismatch
      - malformed_content
      - unlinkable_result
      - extraction_failed
      - rail_failed
      - per_tool_rail
      title: ToolViolationType
      type: string
    TopLogprob:
      additionalProperties: true
      properties:
        bytes:
          anyOf:
          - items:
              type: integer
            type: array
          - type: 'null'
          title: Bytes
        logprob:
          title: Logprob
          type: number
        token:
          title: Token
          type: string
      required:
      - token
      - logprob
      title: TopLogprob
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    _GuardrailsContextMessageSchema:
      additionalProperties: false
      properties:
        content:
          additionalProperties: true
          title: Content
          type: object
        role:
          const: context
          title: Role
          type: string
      required:
      - content
      - role
      title: _GuardrailsContextMessageSchema
      type: object
    _OpenAIAssistantMessageSchema:
      additionalProperties: false
      properties:
        content:
          anyOf:
          - type: string
          - items:
              anyOf:
              - $ref: '#/components/schemas/_OpenAITextContentPartSchema'
              - $ref: '#/components/schemas/_OpenAIRefusalContentPartSchema'
            type: array
          - type: 'null'
          title: Content
        function_call:
          anyOf:
          - $ref: '#/components/schemas/_OpenAIFunctionCallSchema'
          - type: 'null'
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        refusal:
          anyOf:
          - type: string
          - type: 'null'
          title: Refusal
        role:
          const: assistant
          title: Role
          type: string
        tool_calls:
          anyOf:
          - items:
              $ref: '#/components/schemas/_OpenAIFunctionToolCallSchema'
            type: array
          - type: 'null'
          title: Tool Calls
      required:
      - role
      title: _OpenAIAssistantMessageSchema
      type: object
    _OpenAIDeveloperMessageSchema:
      additionalProperties: false
      properties:
        content:
          anyOf:
          - type: string
          - items:
              $ref: '#/components/schemas/_OpenAITextContentPartSchema'
            type: array
          title: Content
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        role:
          const: developer
          title: Role
          type: string
      required:
      - content
      - role
      title: _OpenAIDeveloperMessageSchema
      type: object
    _OpenAIFileContentPartSchema:
      additionalProperties: false
      properties:
        file:
          $ref: '#/components/schemas/_OpenAIFileSchema'
        prompt_cache_breakpoint:
          anyOf:
          - $ref: '#/components/schemas/_OpenAIPromptCacheBreakpointSchema'
          - type: 'null'
        type:
          const: file
          title: Type
          type: string
      required:
      - file
      - type
      title: _OpenAIFileContentPartSchema
      type: object
    _OpenAIFileSchema:
      additionalProperties: false
      properties:
        file_data:
          anyOf:
          - type: string
          - type: 'null'
          title: File Data
        file_id:
          anyOf:
          - type: string
          - type: 'null'
          title: File Id
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
      title: _OpenAIFileSchema
      type: object
    _OpenAIFunctionCallSchema:
      additionalProperties: false
      properties:
        arguments:
          title: Arguments
          type: string
        name:
          title: Name
          type: string
      required:
      - arguments
      - name
      title: _OpenAIFunctionCallSchema
      type: object
    _OpenAIFunctionMessageSchema:
      additionalProperties: false
      properties:
        content:
          anyOf:
          - type: string
          - type: 'null'
          title: Content
        name:
          title: Name
          type: string
        role:
          const: function
          title: Role
          type: string
      required:
      - content
      - name
      - role
      title: _OpenAIFunctionMessageSchema
      type: object
    _OpenAIFunctionToolCallSchema:
      additionalProperties: false
      properties:
        function:
          $ref: '#/components/schemas/_OpenAIFunctionCallSchema'
        id:
          title: Id
          type: string
        type:
          const: function
          title: Type
          type: string
      required:
      - id
      - function
      - type
      title: _OpenAIFunctionToolCallSchema
      type: object
    _OpenAIImageContentPartSchema:
      additionalProperties: false
      properties:
        image_url:
          $ref: '#/components/schemas/_OpenAIImageURLSchema'
        prompt_cache_breakpoint:
          anyOf:
          - $ref: '#/components/schemas/_OpenAIPromptCacheBreakpointSchema'
          - type: 'null'
        type:
          const: image_url
          title: Type
          type: string
      required:
      - image_url
      - type
      title: _OpenAIImageContentPartSchema
      type: object
    _OpenAIImageURLSchema:
      additionalProperties: false
      properties:
        detail:
          anyOf:
          - enum:
            - auto
            - low
            - high
            type: string
          - type: 'null'
          title: Detail
        url:
          title: Url
          type: string
      required:
      - url
      title: _OpenAIImageURLSchema
      type: object
    _OpenAIPromptCacheBreakpointSchema:
      additionalProperties: false
      properties:
        mode:
          const: explicit
          title: Mode
          type: string
      required:
      - mode
      title: _OpenAIPromptCacheBreakpointSchema
      type: object
    _OpenAIRefusalContentPartSchema:
      additionalProperties: false
      properties:
        refusal:
          title: Refusal
          type: string
        type:
          const: refusal
          title: Type
          type: string
      required:
      - refusal
      - type
      title: _OpenAIRefusalContentPartSchema
      type: object
    _OpenAISystemMessageSchema:
      additionalProperties: false
      properties:
        content:
          anyOf:
          - type: string
          - items:
              $ref: '#/components/schemas/_OpenAITextContentPartSchema'
            type: array
